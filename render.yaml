databases:
  - name: django-postgres-db
    plan: free
    databaseName: django_postgres
    user: django_postgres

services:
  - type: web
    name: Tienda-desplege
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.8.18
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_USE_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SERVE_MEDIA
        value: "true"
      - key: DJANGO_USE_DATABASE_MEDIA_STORAGE
        value: "true"
      - key: APP_EDITION
        value: cloud_backup
      - key: CLOUD_BACKUP_ENABLED
        value: "true"
      - key: SYNC_API_TOKEN
        generateValue: true
      - key: SYNC_PULL_LIMIT
        value: "500"
      - key: SYNC_PUSH_LIMIT_MAX
        value: "500"
      - key: SUPERADMIN_USERNAME
        value: superadmin
      - key: SUPERADMIN_EMAIL
        value: superadmin@example.com
      - key: SUPERADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: django-postgres-db
          property: connectionString
